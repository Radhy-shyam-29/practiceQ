<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #container {
        height: 100vh;
        width: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .circle {
        border: 2px solid black;
        height: 50px;
        width: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        background-color: black;
        border-color: tomato;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <button id="prev">previous</button>
      <div class="circle active" id="circle-1">circle1</div>
      <div class="circle" id="circle-2">circle2</div>
      <div class="circle" id="circle-3">circle3</div>
      <div class="circle" id="circle-4">circle4</div>
      <div class="circle" id="circle-5">circle5</div>
      <button id="next">next</button>
    </div>

    <script>
      let circles = document.querySelectorAll(".circle");
      let nextBtn = document.getElementById("next");
      let prevBtn = document.getElementById("prev");
      let currentStep = 1;

      nextBtn.addEventListener("click", (e) => {
        if (currentStep < circles.length) {
          currentStep++
         circles.forEach((value,index) => {
          if(index < currentStep){
            value.classList.add('active')
          }else{
            value.classList.remove('active')
          }
         })
        }
      });

      prevBtn.addEventListener('click', ()=>{
        if(currentStep > circles.length){
          currentStep--
        }
      })
    </script>
  </body>
</html>
